apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-native-service
  labels:
    app: cloud-native-service

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: cloud-native-service

  template:
    metadata:
      labels:
        app: cloud-native-service

    spec:
      containers:
        - name: cloud-native-service
          image: tahsinuldev/cloud-native-service:1.0.3
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000
              name: http

          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: cloud-native-config
                  key: PORT

            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: cloud-native-config
                  key: LOG_LEVEL

            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: cloud-native-config
                  key: ENVIRONMENT

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
