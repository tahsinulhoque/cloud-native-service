
name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # 1. Python Quality, Linting & Unit Tests
  # ==========================================
  quality-check:
    name: Python Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff lint
        run: python -m ruff check .

      - name: Run unit tests with coverage
        run: |
          python -m pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  # ==========================================
  # 2. Dockerfile Linting
  # ==========================================
  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  # ==========================================
  # 3. Shell Script Linting
  # ==========================================
  shellcheck:
    name: Shell Script Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        shell: bash
        run: |
          mapfile -d '' scripts < <(
            find . -type f -name '*.sh' \
              -not -path './.git/*' -print0
          )

          if [ "${#scripts[@]}" -gt 0 ]; then
            shellcheck "${scripts[@]}"
          else
            echo "No shell scripts found."
          fi

  # ==========================================
  # 4. Docker Build & Trivy Security Scan
  # ==========================================
  docker-security:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest

    needs:
      - quality-check
      - dockerfile-lint
      - shellcheck

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --pull \
            -t cloud-native-service:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloud-native-service:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL

  # ==========================================
  # 5. Multi-Architecture Build & Docker Hub Push
  # ==========================================
  docker-publish:
    name: Multi-Arch Build & Push to Docker Hub
    runs-on: ubuntu-latest

    needs:
      - docker-security

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            tahsinuldev/cloud-native-service:${{ github.sha }}
            tahsinuldev/cloud-native-service:1.0.3
          cache-from: type=gha
          cache-to: type=gha,mode=max
