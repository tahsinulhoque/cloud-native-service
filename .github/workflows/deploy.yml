name: Deploy to EC2

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy application to EC2
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DOCKERHUB_USERNAME: tahsinuldev
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify required configuration
        shell: bash
        run: |
          set -euo pipefail

          test -n "$AWS_REGION" || {
            echo "AWS_REGION is missing"
            exit 1
          }

          test -n "$EC2_INSTANCE_ID" || {
            echo "EC2_INSTANCE_ID is missing"
            exit 1
          }

          echo "AWS configuration verified."

      - name: Verify EC2 SSM connectivity
        run: |
          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${EC2_INSTANCE_ID}" \
            --region "${AWS_REGION}"

      - name: Deploy image through SSM with automatic rollback
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${DOCKERHUB_USERNAME}/cloud-native-service:${IMAGE_TAG}"

          DEPLOY_SCRIPT=$(cat <<EOF
          #!/bin/bash
          set -Eeuo pipefail

          NEW_IMAGE="${IMAGE}"
          CONTAINER="cloud-native-service"
          BACKUP="cloud-native-service-previous"

          rollback() {
            echo "Deployment failed. Rolling back..."

            docker rm -f "\$CONTAINER" >/dev/null 2>&1 || true

            if docker inspect "\$BACKUP" >/dev/null 2>&1; then
              docker rename "\$BACKUP" "\$CONTAINER"
              docker start "\$CONTAINER"
              echo "Previous container restored."
            else
              echo "No previous container available."
            fi
          }

          # Pull the new application image
          docker pull "\$NEW_IMAGE"

          # Preserve the currently running container
          if docker inspect "\$BACKUP" >/dev/null 2>&1; then
            echo "Removing stale backup container."
            docker rm -f "\$BACKUP"
          fi

          if docker inspect "\$CONTAINER" >/dev/null 2>&1; then
            docker stop "\$CONTAINER"
            docker rename "\$CONTAINER" "\$BACKUP"
          fi

          # Start the new application version
          if ! docker run -d \
            --name "\$CONTAINER" \
            --restart unless-stopped \
            -e ENVIRONMENT=staging \
            -p 80:8000 \
            --log-driver=awslogs \
            --log-opt awslogs-region=us-west-2 \
            --log-opt awslogs-group=/cloud-native-service/staging \
            --log-opt awslogs-create-group=false \
            "\$NEW_IMAGE"; then
            rollback
            exit 1
          fi

          # Application health smoke test
          HEALTHY=false

          for attempt in {1..12}; do
            if curl --fail --silent http://localhost/health >/dev/null; then
              HEALTHY=true
              break
            fi
            sleep 5
          done

          if [ "\$HEALTHY" != "true" ]; then
            echo "Health check failed."
            rollback
            exit 1
          fi

          echo "Deployment successful: \$NEW_IMAGE"

          # Remove backup only after successful health check
          if docker inspect "\$BACKUP" >/dev/null 2>&1; then
            docker rm -f "\$BACKUP"
          fi
          EOF
          )

          PARAMETERS=$(jq -n --arg command "$DEPLOY_SCRIPT" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --comment "Deploy cloud-native-service ${IMAGE_TAG}" \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
