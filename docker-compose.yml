
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: cloud-native-service:1.0.0
    container_name: cloud-native-service

    ports:
      - "8080:8000"

    environment:
      PORT: "8000"
      LOG_LEVEL: "INFO"
      ENVIRONMENT: "development"
      APP_VERSION: "1.0.0"

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    cpus: 0.50
    mem_limit: 256m
